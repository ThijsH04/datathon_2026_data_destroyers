[project]
name = "datathon2026-challenge-harness"
version = "0.1.0"
description = "Starter FastAPI harness for the Datathon 2026 listings challenge."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.50.0",
    "pillow>=11.0.0",
    "beautifulsoup4>=4.14.3",
    "boto3>=1.39.0,<2.0.0",
    "fastapi>=0.115.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "lxml>=6.1.0",
    "mcp>=1.25.0",
    "tqdm>=4.67.0",
    "uvicorn[standard]>=0.32.0,<1.0.0",
    "requests>=2.33.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0,<9.0.0",
]
image-filter = [
    "imagehash>=4.3.1",
    "open-clip-torch>=2.26.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "apps_sdk"]

[tool.pytest.ini_options]
pythonpath = ["."]
